services:
  identity-db:
    image: postgres:17
    container_name: flowledger-identity-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_identity
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in your environment}

    ports:
      - "5433:5432"

    volumes:
      - identity_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

  bank-integration-db:
    image: postgres:17
    container_name: flowledger-bank-integration-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_bank_integration
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${BANK_INTEGRATION_DB_PASSWORD:?Set BANK_INTEGRATION_DB_PASSWORD in your environment}

    ports:
      - "5434:5432"

    volumes:
      - bank_integration_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_bank_integration"]
      interval: 10s
      timeout: 5s
      retries: 5

  cash-management-db:
    image: postgres:17
    container_name: flowledger-cash-management-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_cash_management
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${CASH_MANAGEMENT_DB_PASSWORD:?Set CASH_MANAGEMENT_DB_PASSWORD in your environment}

    ports:
      - "5435:5432"

    volumes:
      - cash_management_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_cash_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:17
    container_name: flowledger-payment-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_payment
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in your environment}

    ports:
      - "5436:5432"

    volumes:
      - payment_db_data:/var/lib/postgresql/data
      # Creates flowledger_payment_test for the test suite (first start of a new volume only).
      - ./backend/payment-service/docker-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  forecast-db:
    image: postgres:17
    container_name: flowledger-forecast-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_forecast
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${FORECAST_DB_PASSWORD:?Set FORECAST_DB_PASSWORD in your environment}

    ports:
      - "5437:5432"

    volumes:
      - forecast_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_forecast"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message broker for the services' outbox events (local development). Management UI on 15672.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: flowledger-rabbitmq
    # RabbitMQ keeps its data per node name, so a fixed hostname keeps it across re-creation.
    hostname: flowledger-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in your environment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in your environment}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

  # Single entry point for the frontend. Optional: docker compose --profile gateway up -d api-gateway
  # (build the jar first). The services still run on the host, so they are reached through
  # host.docker.internal. The gateway holds no secrets; each service checks tokens itself.
  api-gateway:
    profiles: ["gateway"]
    build: ./backend/api-gateway
    container_name: flowledger-api-gateway
    restart: unless-stopped

    environment:
      IDENTITY_SERVICE_URL: http://host.docker.internal:8080
      CASH_MANAGEMENT_SERVICE_URL: http://host.docker.internal:8081
      BANK_INTEGRATION_SERVICE_URL: http://host.docker.internal:8082
      PAYMENT_SERVICE_URL: http://host.docker.internal:8083
      FORECAST_SERVICE_URL: http://host.docker.internal:8084
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8088:8088"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8088 && printf \"GET /api/v1/gateway/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  identity_db_data:
  bank_integration_db_data:
  cash_management_db_data:
  payment_db_data:
  forecast_db_data:
  rabbitmq_data: