services:
  identity-db:
    image: postgres:17
    container_name: flowledger-identity-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_identity
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in your environment}

    ports:
      - "5433:5432"

    volumes:
      - identity_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

  bank-integration-db:
    image: postgres:17
    container_name: flowledger-bank-integration-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_bank_integration
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${BANK_INTEGRATION_DB_PASSWORD:?Set BANK_INTEGRATION_DB_PASSWORD in your environment}

    ports:
      - "5434:5432"

    volumes:
      - bank_integration_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_bank_integration"]
      interval: 10s
      timeout: 5s
      retries: 5

  cash-management-db:
    image: postgres:17
    container_name: flowledger-cash-management-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_cash_management
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${CASH_MANAGEMENT_DB_PASSWORD:?Set CASH_MANAGEMENT_DB_PASSWORD in your environment}

    ports:
      - "5435:5432"

    volumes:
      - cash_management_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_cash_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:17
    container_name: flowledger-payment-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_payment
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in your environment}

    ports:
      - "5436:5432"

    volumes:
      - payment_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  forecast-db:
    image: postgres:17
    container_name: flowledger-forecast-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_forecast
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${FORECAST_DB_PASSWORD:?Set FORECAST_DB_PASSWORD in your environment}

    ports:
      - "5437:5432"

    volumes:
      - forecast_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_forecast"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  identity_db_data:
  bank_integration_db_data:
  cash_management_db_data:
  payment_db_data:
  forecast_db_data: