services:
  identity-db:
    image: postgres:17
    container_name: flowledger-identity-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowledger_identity
      POSTGRES_USER: flowledger_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in your environment}

    ports:
      - "5433:5432"

    volumes:
      - identity_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger_app -d flowledger_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  identity_db_data: