spring.application.name=api-gateway
server.port=8088

# Optional local settings from the repository-root .env (service URLs, allowed origins).
# The gateway needs no secrets: every service validates tokens and access itself.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# Requests are streamed to the services unchanged, so multipart uploads are not parsed here.
spring.servlet.multipart.enabled=false
spring.mvc.problemdetails.enabled=true

# Calls to the services. A service that cannot be reached returns 503; one that does not answer
# in time returns 504.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=30s

# Browser origins allowed to call the gateway directly (comma-separated). Production must list
# only the HTTPS origin of the deployed frontend.
flowledger.gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Routes: each service keeps its own /api/v1/<service> prefix, so paths are forwarded unchanged.
# /internal/** is never routed. Clients cannot send the internal API key through the gateway.
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=${IDENTITY_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/identity/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RemoveRequestHeader=X-Internal-Api-Key

spring.cloud.gateway.server.webmvc.routes[1].id=cash-management
spring.cloud.gateway.server.webmvc.routes[1].uri=${CASH_MANAGEMENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/cash-management/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RemoveRequestHeader=X-Internal-Api-Key

spring.cloud.gateway.server.webmvc.routes[2].id=bank-integration
spring.cloud.gateway.server.webmvc.routes[2].uri=${BANK_INTEGRATION_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/bank-integration/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RemoveRequestHeader=X-Internal-Api-Key

spring.cloud.gateway.server.webmvc.routes[3].id=payment
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RemoveRequestHeader=X-Internal-Api-Key

spring.cloud.gateway.server.webmvc.routes[4].id=forecast
spring.cloud.gateway.server.webmvc.routes[4].uri=${FORECAST_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/forecast/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=RemoveRequestHeader=X-Internal-Api-Key
