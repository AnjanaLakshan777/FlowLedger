# Test-only JWT signing key, loaded on top of the main application.properties so the
# test suite does not depend on a developer's .env. Never use this key anywhere else.
flowledger.security.jwt.secret=wMeOLJDTrecFv3JNSn7Tu2xc2XKTgTCLATNbl470eIs=

# Test-only internal API secret and short read timeouts for the timeout tests.
flowledger.identity.internal-api-secret=f788b886fa5580a361df0dce94442bb2a5613bf860a594684fc2b7f643eba9a7
flowledger.identity.read-timeout=1s
flowledger.bank-integration.read-timeout=1s
flowledger.payment.read-timeout=1s

# The cheque-event listener only runs in the tests that enable it, against their own queues.
flowledger.cheque-events.enabled=false
flowledger.cheque-events.initial-backoff=10ms
flowledger.cheque-events.max-backoff=40ms

# Test-only key for the payment-service internal API (the fake server checks it); fast backfill retries.
flowledger.payment.internal-api-secret=7c1d9e3b5a2f4c6e8d0b1a3c5e7f9d2b4a6c8e0f1d3b5a7c9e2f4d6b8a0c1e3f
flowledger.cheque-backfill.initial-backoff=10ms
flowledger.cheque-backfill.max-backoff=40ms
flowledger.cheque-verification.retry-delay=10ms
# Forecast tests store a fresh VERIFIED result with their projected cheques and use it; the on-the-spot
# check when it is missing or older is tested on its own (ForecastChequeVerificationIntegrationTest).
flowledger.cheque-verification.max-age=1h
# Tests never reach a real cash-management-service; tests that need it point this at a fake.
flowledger.cash-management.base-url=http://127.0.0.1:9
flowledger.cash-management.read-timeout=1s
# The suite keeps about ten Spring contexts open; small pools keep them under PostgreSQL's 100 connections.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
