spring.application.name=forecast-service
server.port=8084

# Local development secrets: load the repository-root .env file (KEY=VALUE lines) if present.
# Paths are relative to the working directory: the first covers running from
# backend/forecast-service (mvnw), the second running from the repository root (VS Code).
# Real environment variables always take precedence over values from .env.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# PostgreSQL Database Connection (this service's own database; see compose.yaml)
spring.datasource.url=${FORECAST_DB_URL:jdbc:postgresql://localhost:5437/flowledger_forecast}
spring.datasource.username=${FORECAST_DB_USERNAME:flowledger_app}
spring.datasource.password=${FORECAST_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
# Responses are built inside explicit transactions. Without this, the first database access of a
# request would keep its connection until the response is written, including while the other
# services are being called.
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true

# Access tokens are issued by identity-service and validated here with the same HS256 key.
# JWT_SECRET has no usable default on purpose: startup fails without a Base64-encoded key
# of at least 256 bits. See docs/decisions.md for the shared-key trade-off.
flowledger.security.jwt.secret=${JWT_SECRET:}
flowledger.security.jwt.issuer=flowledger-identity

# Company membership checks against identity-service's internal API.
# IDENTITY_SERVICE_URL defaults to identity-service running on this machine; inside Docker
# Compose it must use the identity-service container name instead of localhost.
# IDENTITY_INTERNAL_API_SECRET has no usable default: startup fails unless it is at least
# 32 characters, and it must match the value identity-service uses.
flowledger.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8080}
flowledger.identity.internal-api-secret=${IDENTITY_INTERNAL_API_SECRET:}
flowledger.identity.connect-timeout=2s
flowledger.identity.read-timeout=3s

# Forecast inputs are read from the owning services with the user's token: the current account,
# confirmed balance, statement coverage and transactions from bank-integration-service, and
# issued cheques from payment-service. Inside Docker Compose, use the container names.
flowledger.bank-integration.base-url=${BANK_INTEGRATION_SERVICE_URL:http://localhost:8082}
flowledger.bank-integration.connect-timeout=2s
flowledger.bank-integration.read-timeout=5s
flowledger.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8083}
flowledger.payment.connect-timeout=2s
flowledger.payment.read-timeout=5s
# Key for payment-service's /internal/** API, used only by the cheque backfill (same value as in
# payment-service). Without it the backfill refuses to start; forecasts do not need it.
flowledger.payment.internal-api-secret=${PAYMENT_INTERNAL_API_SECRET:}

# RabbitMQ: cheque events published by payment-service (see compose.yaml and docs/decisions.md).
# RABBITMQ_USERNAME and RABBITMQ_PASSWORD come from .env; inside Docker Compose, RABBITMQ_HOST is
# the rabbitmq container name. If the broker is down, the service still starts and serves
# forecasts; the listener keeps reconnecting.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.listener.simple.prefetch=10

# The cheque projection is kept current from these events but not yet used by calculations.
flowledger.cheque-events.enabled=${CHEQUE_EVENTS_CONSUMER_ENABLED:true}
flowledger.cheque-events.exchange=flowledger.payment
flowledger.cheque-events.binding-key=cheque.*
flowledger.cheque-events.queue=forecast.payment-cheque-events
flowledger.cheque-events.dead-letter-exchange=forecast.payment-cheque-events.dlx
flowledger.cheque-events.dead-letter-queue=forecast.payment-cheque-events.dlq
flowledger.cheque-events.max-attempts=4
flowledger.cheque-events.initial-backoff=500ms
flowledger.cheque-events.max-backoff=5s
flowledger.cheque-events.delivery-limit=5

# Cheque backfill from the payment-service internal scan into forecast_cheques (resumable; see
# docs/decisions.md). Off by default; CHEQUE_BACKFILL_ON_STARTUP=true starts or resumes it in the
# background after startup. Failed pages are retried with capped exponential backoff.
flowledger.cheque-backfill.run-on-startup=${CHEQUE_BACKFILL_ON_STARTUP:false}
flowledger.cheque-backfill.page-size=200
flowledger.cheque-backfill.max-attempts=5
flowledger.cheque-backfill.initial-backoff=1s
flowledger.cheque-backfill.max-backoff=30s

# Cheque projection verification against the payment-service summary (see docs/decisions.md). Runs
# after a backfill started on startup completes. RETRY_REQUIRED companies are checked again up to
# max-attempts times per pass, retry-delay apart.
flowledger.cheque-verification.max-attempts=3
flowledger.cheque-verification.retry-delay=5s
