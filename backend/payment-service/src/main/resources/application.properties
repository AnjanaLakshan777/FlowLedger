spring.application.name=payment-service
server.port=8083

# Local development secrets: load the repository-root .env file (KEY=VALUE lines) if present.
# Paths are relative to the working directory: the first covers running from
# backend/payment-service (mvnw), the second running from the repository root (VS Code).
# Real environment variables always take precedence over values from .env.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# PostgreSQL Database Connection (this service's own database; see compose.yaml)
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5436/flowledger_payment}
spring.datasource.username=${PAYMENT_DB_USERNAME:flowledger_app}
spring.datasource.password=${PAYMENT_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migrations
spring.flyway.enabled=true

# Access tokens are issued by identity-service and validated here with the same HS256 key.
# JWT_SECRET has no usable default on purpose: startup fails without a Base64-encoded key
# of at least 256 bits. See docs/decisions.md for the shared-key trade-off.
flowledger.security.jwt.secret=${JWT_SECRET:}
flowledger.security.jwt.issuer=flowledger-identity

# Company membership checks against identity-service's internal API.
# IDENTITY_SERVICE_URL defaults to identity-service running on this machine; inside Docker
# Compose it must use the identity-service container name instead of localhost.
# IDENTITY_INTERNAL_API_SECRET has no usable default: startup fails unless it is at least
# 32 characters, and it must match the value identity-service uses.
flowledger.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8080}
flowledger.identity.internal-api-secret=${IDENTITY_INTERNAL_API_SECRET:}
flowledger.identity.connect-timeout=2s
flowledger.identity.read-timeout=3s

# The company's current account is looked up in bank-integration-service with the user's token.
# Inside Docker Compose, BANK_INTEGRATION_SERVICE_URL must use the container name.
flowledger.bank-integration.base-url=${BANK_INTEGRATION_SERVICE_URL:http://localhost:8082}
flowledger.bank-integration.connect-timeout=2s
flowledger.bank-integration.read-timeout=3s

# RabbitMQ: cheque events from the outbox are published to the flowledger.payment exchange.
# Publisher confirms, returns and mandatory publishing let the publisher mark an event published
# only after the broker accepted it and could route it.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Outbox publisher. OUTBOX_PUBLISHER_ENABLED=false pauses sending; events keep accumulating.
# Only events written after migration V2 are ever eligible (see docs/decisions.md).
flowledger.outbox.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
flowledger.outbox.batch-size=50
flowledger.outbox.poll-interval=1000
flowledger.outbox.lease=60s
flowledger.outbox.confirm-timeout=10s
flowledger.outbox.initial-backoff=5s
flowledger.outbox.max-backoff=15m
