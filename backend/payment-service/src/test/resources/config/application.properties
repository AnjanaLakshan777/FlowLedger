flowledger.security.jwt.secret=aTe1tWBQedRjrIph26KWOb2nx6Rnrd7ntw4P4kiDIfo=

# Test-only internal API secret and short read timeouts for the timeout tests.
flowledger.identity.internal-api-secret=86d2bff234b7d5b7f00570f11665c7a6603d36cd0ae694ce62bd4eea4aa61c17
flowledger.identity.read-timeout=1s
flowledger.bank-integration.read-timeout=1s

# Test-only key for this service's own internal API.
flowledger.security.internal-api.secret=3f9c1e7a52d84b6f9a0e2c4d6b8f1a3c5e7d9b2f4a6c8e0d1b3f5a7c9e2d4b6f

# The scheduled outbox publisher is off in tests; outbox tests call it directly for their own rows.
flowledger.outbox.enabled=false
flowledger.outbox.confirm-timeout=3s

# Tests never share state with a payment-service running locally. Their own database: otherwise
# the running service's publisher picks up the tests' outbox rows and sends them to forecast-service,
# whose dead-letter queue then blocks every forecast. Their own exchange: no forecast queue is bound
# to it, so events the tests publish never reach forecast-service either.
spring.datasource.url=${PAYMENT_TEST_DB_URL:jdbc:postgresql://localhost:5436/flowledger_payment_test}
flowledger.outbox.exchange=flowledger.payment.test
