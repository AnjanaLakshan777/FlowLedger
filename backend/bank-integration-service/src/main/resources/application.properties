spring.application.name=bank-integration-service
server.port=8082

# Local development secrets: load the repository-root .env file (KEY=VALUE lines) if present.
# Paths are relative to the working directory: the first covers running from
# backend/bank-integration-service (mvnw), the second running from the repository root (VS Code).
# Real environment variables always take precedence over values from .env.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# PostgreSQL Database Connection (this service's own database; see compose.yaml)
spring.datasource.url=${BANK_INTEGRATION_DB_URL:jdbc:postgresql://localhost:5434/flowledger_bank_integration}
spring.datasource.username=${BANK_INTEGRATION_DB_USERNAME:flowledger_app}
spring.datasource.password=${BANK_INTEGRATION_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migrations
spring.flyway.enabled=true

# Access tokens are issued by identity-service and validated here with the same HS256 key.
# JWT_SECRET has no usable default on purpose: startup fails without a Base64-encoded key
# of at least 256 bits. See docs/decisions.md for the shared-key trade-off.
flowledger.security.jwt.secret=${JWT_SECRET:}
flowledger.security.jwt.issuer=flowledger-identity
