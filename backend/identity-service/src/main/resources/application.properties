spring.application.name=identity-service

# Local development secrets: load the repository-root .env file (KEY=VALUE lines) if present.
# Paths are relative to the working directory: the first covers running from backend/identity-service
# (mvnw), the second running from the repository root (VS Code launches from the workspace folder).
# Real environment variables always take precedence over values from .env.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# PostgreSQL Database Connection (this service's own database; see compose.yaml)
# IDENTITY_DB_PASSWORD has no default on purpose. If it is not provided, startup fails with
# "password authentication failed for user" from PostgreSQL.
spring.datasource.url=${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/flowledger_identity}
spring.datasource.username=${IDENTITY_DB_USERNAME:flowledger_app}
spring.datasource.password=${IDENTITY_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migrations
spring.flyway.enabled=true

# JWT access tokens (HS256)
# JWT_SECRET has no usable default on purpose: startup fails unless it is a Base64-encoded
# key of at least 256 bits. Generate one with: openssl rand -base64 32
flowledger.security.jwt.secret=${JWT_SECRET:}
flowledger.security.jwt.issuer=flowledger-identity
flowledger.security.jwt.access-token-ttl=15m

# Internal API (/internal/**) for other FlowLedger services. Callers send this shared secret in
# the X-Internal-Api-Key header together with the user's access token. No usable default:
# startup fails unless it is at least 32 characters. Generate one with: openssl rand -hex 32
flowledger.security.internal-api.secret=${IDENTITY_INTERNAL_API_SECRET:}
